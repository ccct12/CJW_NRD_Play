  /* 모든 기기 같은 배치(원랜디와 동일): 보스 아이콘은 오른쪽 위, '지금 조합 가능'과 9개 메뉴는 늘 오른쪽 아래 */
  #res { order:1; } #tbtns { order:2; } #boss { order:3; }

  }
